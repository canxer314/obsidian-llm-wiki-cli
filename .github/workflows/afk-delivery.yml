name: AFK Delivery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  discover:
    runs-on: [self-hosted, afk-delivery]
    timeout-minutes: 10
    outputs:
      tickets: ${{ steps.frontier.outputs.tickets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run build -w @llm-wiki/afk-delivery-orchestrator
      - name: Worker preflight
        env:
          GITHUB_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
          GH_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
          MODEL_GATEWAY_URL: ${{ secrets.MODEL_GATEWAY_URL }}
          AFK_DELIVERY_IMAGE: ${{ vars.AFK_DELIVERY_IMAGE }}
          AFK_DELIVERY_SKILL_MANIFEST: .sandcastle/skills.lock
          AFK_DELIVERY_ACTOR: ${{ vars.AFK_DELIVERY_ACTOR }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery preflight
      - id: frontier
        name: Discover Delivery Frontier
        env:
          GITHUB_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery discover

  deliver:
    needs: discover
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: needs.discover.outputs.tickets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ticket: ${{ fromJSON(needs.discover.outputs.tickets) }}
    runs-on: [self-hosted, afk-delivery]
    timeout-minutes: 75
    concurrency:
      group: afk-delivery-${{ github.repository }}-ticket-${{ matrix.ticket }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AFK_DELIVERY_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run build -w @llm-wiki/afk-delivery-orchestrator
      - name: Worker preflight
        env:
          GITHUB_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
          GH_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
          MODEL_GATEWAY_URL: ${{ secrets.MODEL_GATEWAY_URL }}
          AFK_DELIVERY_IMAGE: ${{ vars.AFK_DELIVERY_IMAGE }}
          AFK_DELIVERY_SKILL_MANIFEST: .sandcastle/skills.lock
          AFK_DELIVERY_ACTOR: ${{ vars.AFK_DELIVERY_ACTOR }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery preflight
      - id: current
        name: Reconstruct current GitHub state
        env:
          GITHUB_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery reconstruct ${{ matrix.ticket }}
      - id: transition
        name: Dispatch one bounded transition
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          AFK_DELIVERY_SNAPSHOT: ${{ steps.current.outputs.snapshot }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery dispatch ${{ matrix.ticket }}
      - name: Implement and publish Managed PR
        env:
          GITHUB_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
          GH_TOKEN: ${{ secrets.AFK_DELIVERY_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MODEL_GATEWAY_URL: ${{ secrets.MODEL_GATEWAY_URL }}
          MODEL_GATEWAY_TOKEN: ${{ secrets.MODEL_GATEWAY_TOKEN }}
          AFK_DELIVERY_IMAGE: ${{ vars.AFK_DELIVERY_IMAGE }}
          AFK_DELIVERY_ACTOR: ${{ vars.AFK_DELIVERY_ACTOR }}
          AFK_DELIVERY_ACTOR_TYPE: ${{ vars.AFK_DELIVERY_ACTOR_TYPE || 'Bot' }}
          AFK_REPOSITORY_INSTRUCTIONS: ${{ github.workspace }}/CLAUDE.md
          AFK_DOMAIN_DOCUMENTS: ${{ github.workspace }}/CONTEXT.md:${{ github.workspace }}/docs/agents/domain.md
          AFK_ARCHITECTURE_DECISIONS: ${{ github.workspace }}/docs/adr/0001-managed-pr-implementation-boundary.md
          AFK_TARGET_BRANCH: master
          AFK_MODEL: fable
          AFK_CONTEXT_WINDOW: "372000"
          AFK_MAX_ITERATIONS: "24"
          AFK_STAGE_TIMEOUT_MS: "3600000"
          AFK_STAGE_CPUS: "2"
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery implement ${{ matrix.ticket }}
