name: AFK Delivery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  discover:
    runs-on: [self-hosted, afk-delivery]
    timeout-minutes: 10
    outputs:
      tickets: ${{ steps.frontier.outputs.tickets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Verify repository
        run: |
          npm run build
          npm run typecheck
          npm test
      - id: app-token
        name: Mint short-lived GitHub App token
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery app-token
      - name: Worker preflight
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AFK_DELIVERY_IMAGE: ${{ vars.AFK_DELIVERY_IMAGE }}
          AFK_REVIEWER_IMAGE: ${{ vars.AFK_REVIEWER_IMAGE }}
          AFK_DELIVERY_SKILL_MANIFEST: ${{ github.workspace }}/.sandcastle/skills.lock
          AFK_DELIVERY_ACTOR: ${{ steps.app-token.outputs.actor_login }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery preflight
      - id: frontier
        name: Discover Delivery Frontier
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AFK_DELIVERY_ACTOR: ${{ steps.app-token.outputs.actor_login }}
          AFK_DELIVERY_ACTOR_TYPE: ${{ steps.app-token.outputs.actor_type }}
          AFK_TARGET_BRANCH: master
          AFK_RECOVERY_SCAN_LIMIT: "100"
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery discover

  deliver:
    needs: discover
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: needs.discover.outputs.tickets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ticket: ${{ fromJSON(needs.discover.outputs.tickets) }}
    runs-on: [self-hosted, afk-delivery]
    timeout-minutes: 75
    concurrency:
      group: afk-delivery-${{ github.repository }}-ticket-${{ matrix.ticket }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Verify repository
        run: |
          npm run build
          npm run typecheck
          npm test
      - id: app-token
        name: Mint short-lived GitHub App token
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery app-token
      - name: Worker preflight
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AFK_DELIVERY_IMAGE: ${{ vars.AFK_DELIVERY_IMAGE }}
          AFK_REVIEWER_IMAGE: ${{ vars.AFK_REVIEWER_IMAGE }}
          AFK_DELIVERY_SKILL_MANIFEST: ${{ github.workspace }}/.sandcastle/skills.lock
          AFK_DELIVERY_ACTOR: ${{ steps.app-token.outputs.actor_login }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery preflight
      - id: current
        name: Reconstruct current GitHub state
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery reconstruct ${{ matrix.ticket }}
      - id: transition
        name: Dispatch one bounded transition
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          AFK_DELIVERY_SNAPSHOT: ${{ steps.current.outputs.snapshot }}
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery dispatch ${{ matrix.ticket }}
      - name: Implement or continue Managed PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          AFK_DELIVERY_IMAGE: ${{ vars.AFK_DELIVERY_IMAGE }}
          AFK_REVIEWER_IMAGE: ${{ vars.AFK_REVIEWER_IMAGE }}
          AFK_DELIVERY_ACTOR: ${{ steps.app-token.outputs.actor_login }}
          AFK_DELIVERY_ACTOR_TYPE: ${{ steps.app-token.outputs.actor_type }}
          AFK_REPOSITORY_INSTRUCTIONS: ${{ github.workspace }}/CLAUDE.md
          AFK_DOMAIN_DOCUMENTS: ${{ github.workspace }}/docs/agents/domain.md:${{ github.workspace }}/docs/contexts/afk-delivery/CONTEXT.md
          AFK_ARCHITECTURE_DECISIONS: ${{ github.workspace }}/docs/adr/0001-github-as-afk-delivery-record.md:${{ github.workspace }}/docs/adr/0001-managed-pr-implementation-boundary.md:${{ github.workspace }}/docs/adr/0002-autonomous-merge-for-ready-delivery-tickets.md
          AFK_TARGET_BRANCH: master
          AFK_MODEL: fable
          AFK_CONTEXT_WINDOW: "372000"
          AFK_MAX_ITERATIONS: "24"
          AFK_STAGE_TIMEOUT_MS: "3600000"
          AFK_STAGE_CPUS: "2"
        run: npm exec -w @llm-wiki/afk-delivery-orchestrator -- afk-delivery implement ${{ matrix.ticket }}
